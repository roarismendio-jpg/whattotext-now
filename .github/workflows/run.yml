name: run
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    # GitHub's cron fires only every few hours on a new repo, so each run stays alive and ticks every
    # 10 minutes for ~5.6h; the next scheduled/queued run takes over when it ends (concurrency queues it).
    timeout-minutes: 350
    env:
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      PUBLISH: ${{ vars.PAUSE == 'yes' && 'off' || 'on' }}  # live; set repo variable PAUSE=yes to stop posting
      MEDIA_BASE_URL: https://roarismendio-jpg.github.io/whattotext-now
      MEDIA_REPO_DIR: .
      TIMEZONE: America/Chicago
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt
      - name: run engine (tick every 10 min)
        run: |
          git config user.name "whattotext-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 335*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase origin main || true
            python3 run.py ci || echo "tick failed, continuing"
            sleep 600
          done
      - name: hand off to the next run (no gap between runs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run.yml --ref main -R ${{ github.repository }}
